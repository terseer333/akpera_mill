<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Akpera Mill</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="#" class="logo">Akpera Mill<span>.</span></a>
            <button class="menu-btn">☰</button>
        </div>
    </nav>

    <main style="max-width: 400px; margin: 80px auto; padding: 0 2rem;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary-brown);">Forgot Password</h2>
            
            <form style="padding: 2rem;">
                <p style="text-align: center; margin-bottom: 2rem; color: #666;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
                
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 0.8rem; color: var(--dark-brown); margin-bottom: 0.3rem;">Email</label>
                    <input type="email" style="width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 4px;" placeholder="your@email.com">
                </div>
                
                <button type="submit" style="width: 100%; padding: 0.8rem; background: var(--primary-brown); color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 500;">Send Reset Link →</button>
            </form>
            
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem;">
                <p>Don't have an account? <a href="signup.html" style="color: var(--accent-gold); text-decoration: underline;">Sign up</a></p>
            </div>
        </div>
    </main>

    <footer style="margin-top: 0;">
        <div style="text-align: center; padding: 2rem; background: var(--primary-brown); color: white;">
            <p>&copy; 2026 Akpera Mill</p>
        </div>
    </footer>
</body>
</html>
