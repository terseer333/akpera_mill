<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Payment - Akpera Mill</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="#" class="logo">Akpera Mill<span>.</span></a>
            <button class="menu-btn">☰</button>
        </div>
    </nav>

    <main style="max-width: 600px; margin: 80px auto; padding: 0 2rem;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary-brown);">Payment Method</h2>
            
            <form style="padding: 2rem;">
                <p style="font-size: 0.9rem; color: var(--dark-brown); margin-bottom: 2rem; text-align: center;">How would you like to pay?</p>
                
                <div style="margin-bottom: 1.5rem;">
                    <div style="background: var(--white); padding: 1rem; border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; border: 2px solid #ddd; transition: border-color 0.3s;" onclick="selectPayment(this)">
                        <span style="font-size: 1.2rem; margin-right: 0.5rem;">💳</span>
                        <span>Card</span>
                        <p style="font-size: 0.7rem; color: #666; margin: 0;">Debit / credit card or Verve</p>
                    </div>
                    
                    <div style="background: var(--white); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; cursor: pointer; border: 2px solid #ddd; transition: border-color 0.3s;" onclick="selectPayment(this)">
                        <span style="font-size: 1.2rem; margin-right: 0.5rem;">🏦</span>
                        <span>Bank Transfer</span>
                        <p style="font-size: 0.7rem; color: #666; margin: 0;">Transfer to Access Bank</p>
                    </div>
                </div>
                
                <div style="background: var(--cream); padding: 1.5rem; border-radius: 8px; margin-top: 1.5rem; display: none; id="card-details">
                    <h4 style="color: var(--primary-brown); margin-bottom: 1rem;">Card Details</h4>
                    <div style="margin-bottom: 0.75rem;">
                        <label style="display: block; font-size: 0.8rem; color: var(--dark-brown); margin-bottom: 0.3rem;">Name on Card</label>
                        <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;" placeholder="Ada Okafor">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.75rem;">
                        <div>
                            <label style="display: block; font-size: 0.8rem; color: var(--dark-brown); margin-bottom: 0.3rem;">Card Number</label>
                            <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;" placeholder="•••• •••• •••• ••••">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.8rem; color: var(--dark-brown); margin-bottom: 0.3rem;">Expiry</label>
                            <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;" placeholder="MM/YY">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                        <div>
                            <label style="display: block; font-size: 0.8rem; color: var(--dark-brown); margin-bottom: 0.3rem;">CVV</label>
                            <input type="text" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;" placeholder="•••">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.8rem; color: var(--dark-brown); margin-bottom: 0.3rem;">Bank</label>
                            <select style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                                <option>Access Bank</option>
                                <option>GTBank</option>
                                <option>Zenith Bank</option>
                                <option>First Bank</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <button type="submit" style="width: 100%; padding: 0.8rem; background: var(--primary-brown); color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 500;">Continue to Review →</button>
            </form>
        </div>
    </main>

    <footer style="margin-top: 0;">
        <div style="text-align: center; padding: 2rem; background: var(--primary-brown); color: white;">
            <p>&copy> 2026 Akpera Mill</p>
        </div>
    </footer>

    <script>
        function selectPayment(element) {
            // Remove selected class from all payment methods
            document.querySelectorAll('.payment-method').forEach(el => {
                el.style.borderColor = '#ddd';
            });
            
            // Add selected class to clicked
            element.style.borderColor = var(--primary-brown);
            
            // Show card details if card is selected
            const cardDetails = document.getElementById('card-details');
            if (element.querySelector('span').textContent === 'Card') {
                cardDetails.style.display = 'block';
            } else {
                cardDetails.style.display = 'none';
            }
        }
    </script>
</body>
</html>
