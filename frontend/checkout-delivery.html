<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Delivery - Akpera Mill</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="#" class="logo">Akpera Mill<span>.</span></a>
            <button class="menu-btn">☰</button>
        </div>
    </nav>

    <main style="max-width: 600px; margin: 80px auto; padding: 0 2rem;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary-brown);">Delivery Address</h2>
            
            <form style="padding: 2rem;">
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 0.8rem; color: var(--dark-brown); margin-bottom: 0.3rem;">Delivery Address</label>
                    <textarea style="width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 4px; height: 100px; margin-bottom: 1rem; resize: vertical;" placeholder="Enter your full delivery address"></textarea>
                </div>
                
                <div style="margin-bottom: 2rem;">
                    <label style="display: block; font-size: 0.8rem; color: var(--dark-brown); margin-bottom: 0.3rem;">Delivery Notes</label>
                    <textarea style="width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 4px; height: 80px; margin-bottom: 1rem; resize: vertical;" placeholder="Any special instructions for delivery (optional)"></textarea>
                </div>
                
                <div style="text-align: center;">
                    <p style="font-size: 0.8rem; color: #666; margin-bottom: 2rem;">Delivery to Lagos: Estimated 2-4 business days after payment</p>
                    <button type="submit" style="width: 100%; padding: 0.8rem; background: var(--primary-brown); color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 500;">Continue to Payment →</button>
                </div>
            </form>
        </div>
    </main>

    <footer style="margin-top: 0;">
        <div style="text-align: center; padding: 2rem; background: var(--primary-brown); color: white;">
            <p>&copy; 2026 Akpera Mill</p>
        </div>
    </footer>
</body>
</html>
