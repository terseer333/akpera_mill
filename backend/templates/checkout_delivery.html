{% extends "base.html" %}
{% block title }Checkout Delivery - Akpera Mill{% endblock %}
{% block content %}

<!-- Checkout Step -->
<section class="checkout-step">
    <div class="container">
        <h2>Delivery Address</h2>
        <form method="POST">
            <div class="form-group">
                <label>Delivery Address</label>
                <textarea name="address" placeholder="Enter your full delivery address" required>{{ session.delivery_address or '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label>Delivery Notes</label>
                <textarea name="notes" placeholder="Any special instructions for delivery (optional)">{{ session.delivery_notes or '' }}</textarea>
            </div>
            
            <button type="submit" style="width: 100%; padding: 1rem; background: var(--primary-brown); color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 500; cursor: pointer;">
                Continue to Payment →
            </button>
        </form>
    </div>
</section>

{% endblock %}
